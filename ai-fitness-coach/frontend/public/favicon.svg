<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Athletic Background -->
  <rect width="64" height="64" rx="16" fill="#0B0C0E"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#B8FD02" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="32" cy="32" r="20" fill="#B8FD02" fill-opacity="0.12" filter="blur(6px)"/>
  
  <!-- FitVision Athletic Dumbbell Icon -->
  <g transform="translate(14, 14)">
    <!-- Left Weight Plate -->
    <rect x="0" y="8" width="6" height="20" rx="3" fill="#B8FD02"/>
    <rect x="6" y="11" width="3" height="14" rx="1.5" fill="#CCFF00"/>
    
    <!-- Central Bar -->
    <rect x="9" y="16" width="18" height="4" rx="2" fill="#FEF9F5"/>
    
    <!-- Central Grip Rings -->
    <line x1="16" y1="15" x2="16" y2="21" stroke="#B8FD02" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="15" x2="20" y2="21" stroke="#B8FD02" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Right Weight Plate -->
    <rect x="27" y="11" width="3" height="14" rx="1.5" fill="#CCFF00"/>
    <rect x="30" y="8" width="6" height="20" rx="3" fill="#B8FD02"/>
    
    <!-- Energy Spark Sparkle -->
    <path d="M18 4L19.5 8.5L24 10L19.5 11.5L18 16L16.5 11.5L12 10L16.5 8.5L18 4Z" fill="#B8FD02"/>
  </g>
</svg>